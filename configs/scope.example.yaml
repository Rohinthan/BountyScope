# BountyScope Target Scope Definition
# Defines authorization boundaries and execution safety limits.

program_name: "example-security-program"
platform: "hackerone"

# Opt-in to permit raw IPv4/IPv6 addresses or CIDR blocks in allowed_domains (default: false)
# When false, strict linting requires fully qualified domain names rather than raw IP addresses.
allow_raw_ip_targets: false

# Allowed root and subdomains permitted for inspection
allowed_domains:
  - "example.com"
  - "*.example.com"
  - "127.0.0.1"

# Explicitly excluded domains (third parties, out-of-scope targets)
excluded_domains:
  - "auth.example.com"
  - "payment.example.com"
  - "status.example.com"

# Excluded URL path patterns (logout, account deletion, sensitive forms)
excluded_paths:
  - "/logout"
  - "/signout"
  - "/unsubscribe"
  - "/delete"
  - "/delete-account"
  - "/reset-password"
  - "/admin/purge"

# Rate limit in requests per second (must not exceed 2 rps by default)
rate_limit_rps: 2

# Safe mode enforces read-only passive inspections and non-destructive payloads
safe_mode: true

# Optional Rules of Engagement (RoE) attribution and Safe Harbor terms
researcher_handle: "security-researcher"
policy_url: "https://hackerone.com/example-security-program/policy"

# Optional list of finding types excluded by program policy
excluded_checks:
  - "missing_security_headers"
