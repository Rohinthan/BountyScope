[package]
name = "bountyscope"
version = "0.14.0"
edition = "2021"
authors = ["BountyScope Contributors"]
description = "Automated vulnerability surface mapping and passive policy verification engine"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
url = "2.5"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.12"
