[package]
name = "bountyscope"
version = "0.14.0"
edition = "2021"
authors = ["BountyScope Contributors"]
description = "Scope-locked vulnerability surface mapping, passive policy auditing, and MCP triage CLI"
license = "Apache-2.0"
repository = "https://github.com/Rohinthan/BountyScope"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
url = "2.5"
percent-encoding = "2.3"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
bytes = "1.12"
scraper = "0.20"
regex = "1.10"
rmcp = { version = "3.10.0", features = ["server", "transport-io"] }
schemars = "1.2.3"

[dev-dependencies]
tempfile = "3.12"
