name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: bountyscope-v${{ github.ref_name }}-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: bountyscope-v${{ github.ref_name }}-macos-aarch64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: bountyscope-v${{ github.ref_name }}-macos-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: bountyscope-v${{ github.ref_name }}-windows-x86_64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release archive and generate checksum (Unix)
        if: runner.os != 'Windows'
        run: |
          ARCHIVE="${{ matrix.archive_name }}"
          ARCHIVE="${ARCHIVE/bountyscope-vv/bountyscope-v}"
          mkdir -p dist/configs
          cp "target/${{ matrix.target }}/release/bountyscope" dist/
          cp LICENSE README.md dist/
          cp configs/scope.example.yaml dist/configs/
          tar -czvf "${ARCHIVE}" -C dist bountyscope LICENSE README.md configs
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi
          echo "RELEASE_ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV
          echo "RELEASE_CHECKSUM=${ARCHIVE}.sha256" >> $GITHUB_ENV

      - name: Package release archive and generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "${{ matrix.archive_name }}"
          if ($archive.StartsWith("bountyscope-vv")) {
              $archive = "bountyscope-v" + $archive.Substring("bountyscope-vv".Length)
          }
          New-Item -ItemType Directory -Force -Path dist\configs
          Copy-Item "target\${{ matrix.target }}\release\bountyscope.exe" -Destination dist\
          Copy-Item LICENSE, README.md -Destination dist\
          Copy-Item configs\scope.example.yaml -Destination dist\configs\
          Compress-Archive -Path dist\* -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"
          echo "RELEASE_ARCHIVE=$archive" >> $env:GITHUB_ENV
          echo "RELEASE_CHECKSUM=$archive.sha256" >> $env:GITHUB_ENV

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.RELEASE_ARCHIVE }}
            ${{ env.RELEASE_CHECKSUM }}
          generate_release_notes: true
